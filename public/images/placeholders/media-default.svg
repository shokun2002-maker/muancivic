<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" fill="none">
  <!-- Background with subtle tint -->
  <rect width="800" height="450" fill="#F7F7F3"/>
  <rect width="800" height="450" fill="url(#media-pattern)" opacity="0.4"/>
  
  <!-- Subtle gradient glow -->
  <circle cx="400" cy="225" r="180" fill="url(#media-glow)" opacity="0.15"/>
  
  <!-- Central Icon Container -->
  <rect x="350" y="175" width="100" height="100" rx="24" fill="#176B52" opacity="0.1"/>
  <rect x="350" y="175" width="100" height="100" rx="24" stroke="#176B52" stroke-width="2" stroke-opacity="0.2"/>
  
  <!-- Camera / Image Icon (Media) -->
  <g transform="translate(376, 201)" stroke="#176B52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="4" y="8" width="40" height="32" rx="6"/>
    <circle cx="24" cy="24" r="9"/>
    <path d="M15 8 L18 4 L30 4 L33 8"/>
  </g>
  
  <!-- Brand Watermark -->
  <text x="400" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#176B52" opacity="0.6" text-anchor="middle" letter-spacing="2">
    사진 · 영상 갤러리
  </text>
  
  <defs>
    <radialGradient id="media-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(400 225) rotate(90) scale(180)">
      <stop stop-color="#176B52"/>
      <stop offset="1" stop-color="#176B52" stop-opacity="0"/>
    </radialGradient>
    <pattern id="media-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 20 L40 20 M20 0 L20 40" stroke="#176B52" stroke-width="0.75" stroke-opacity="0.05"/>
    </pattern>
  </defs>
</svg>
